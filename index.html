<!doctype html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Justmine Tea</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Nunito:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap"
    rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
    rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            background: '#FFFFFF',                   // Bersih putih modern
            surface: '#FFFFFF',
            'surface-container-lowest': '#FFFFFF',   // Card: Putih bersih
            'surface-container-low': '#F8F9FA',      // Netral sangat lembut
            'surface-container': '#F1F3F5',          // Abu-abu terang elegan
            'surface-container-high': '#E9ECEF',     // Divider / Border lembut
            'on-surface': '#111827',                 // Teks gelap tegas & terbaca jelas
            'on-surface-variant': '#4B5563',         // Muted text slate abu
            outline: '#9CA3AF',
            'outline-variant': '#E5E7EB',            // Border tipis bersih modern

            primary: '#1E3A2F',                      // Deep botanical green mewah
            'on-primary': '#FFFFFF',                 // Kontras tinggi
            'primary-container': '#264B3C',
            'primary-fixed': '#E8F3ED',              // Sage lembut untuk badge

            secondary: '#366A4E',                    // Hijau daun teh elegan
            'secondary-container': '#EDF5EF',
            'on-secondary-container': '#1E3A2F',

            tertiary: '#A1701F',                     // Emas teh melati
            'tertiary-fixed': '#FEF7EA',
            'on-tertiary-fixed': '#2B1C04',

            error: '#DC2626',
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
            serif: ['Cormorant Garamond', 'Georgia', 'serif'],
          },
        },
      },
    }
  </script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #FFFFFF;
      color: #111827;
    }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
