<!doctype html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Justmine Tea</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Nunito:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap"
    rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
    rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            background: '#FAF7F0',
            surface: '#FAF7F0',
            'surface-container-lowest': '#FFFFFF',   // card: putih, biar kepisah dari background
            'surface-container-low': '#F3F0E6',      // netral hangat, bukan hijau lagi
            'surface-container': '#ECE8DA',
            'surface-container-high': '#E3DDC9',
            'on-surface': '#1F2A24',
            'on-surface-variant': '#5F665F',
            outline: '#72796F',
            'outline-variant': '#D5D8CC',

            primary: '#2E4E3A',            // hijau tua: tombol utama, header, badge meja
            'on-primary': '#FFFFFF',       // kontras ~9:1
            'primary-container': '#1B3826',
            'primary-fixed': '#DCE7DA',    // sage pucat buat chip/selected state

            secondary: '#5B8C5A',          // hijau tengah: ikon, state aktif, bukan tombol bertulisan putih
            'secondary-container': '#EAF2EA',
            'on-secondary-container': '#2E4E3A',

            tertiary: '#C9A24B',           // emas jasmine: harga, badge promo, CTA sekunder
            'tertiary-fixed': '#FBEBC8',
            'on-tertiary-fixed': '#251A04',

            error: '#BA1A1A',
            // skala tea boleh tetap
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
            serif: ['Cormorant Garamond', 'Georgia', 'serif'],
          },
        },
      },
    }
  </script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #FBF8EF;
      background-image:
        radial-gradient(circle at 1px 1px, rgba(91, 140, 90, 0.04) 1px, transparent 0);
      background-size: 24px 24px;
    }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
